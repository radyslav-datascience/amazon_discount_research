# Amazon Double Pack Discount Optimization
# Conda Environment Configuration
#
# Create environment with: conda env create -f environment.yml
# Activate with: conda activate amazon_research
#
# Author: Radyslav Lomanov
# GitHub: https://github.com/radyslav-datascience/amazon_discount_research

name: amazon_research

channels:
  - conda-forge
  - defaults

dependencies:
  # ============================================================================
  # Python Version
  # ============================================================================
  - python=3.11

  # ============================================================================
  # Core Data Processing
  # ============================================================================
  - pandas>=2.0
  - numpy>=1.24

  # ============================================================================
  # Excel/Spreadsheet Operations
  # ============================================================================
  - openpyxl>=3.1

  # ============================================================================
  # Scientific Computing & Optimization
  # ============================================================================
  - scipy>=1.10
  - statsmodels>=0.14

  # ============================================================================
  # Visualization
  # ============================================================================
  - matplotlib>=3.7
  - seaborn>=0.12

  # ============================================================================
  # Jupyter Support
  # ============================================================================
  - jupyter
  - ipykernel

  # ============================================================================
  # Additional Tools
  # ============================================================================
  - pip

  # ============================================================================
  # pip-only packages (not available in conda or prefer pip version)
  # ============================================================================
  - pip:
    - plotly>=5.0
